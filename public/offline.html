<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Docutile</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; color: #e2e8f0;
    background: radial-gradient(40rem 30rem at 50% 30%, rgba(34,211,238,.18), transparent 60%), #050816; }
  main { max-width: 28rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
  p { color: #cbd5e1; line-height: 1.5; }
  a { display: inline-block; margin-top: 1rem; padding: .6rem 1.1rem; border-radius: .5rem; color: #fff; text-decoration: none; background: linear-gradient(90deg, #0e7490, #6d28d9); }
  a:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page has not been saved for offline use yet. Pages you have opened before still work offline, and your packs and files are stored in this browser.</p>
  <a href="/">Go to the dashboard</a>
</main>
</body>
</html>
